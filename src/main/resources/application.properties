spring.application.name=covibe-attendance-portal
server.port=8080
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Bundled data files inside src/main/resources/data/ (replace weekly)
covibe.data-dir=./data-files
covibe.attendance-file=data/attendance.dat
covibe.last-week-file=data/attendance-last-week.dat
covibe.users-file=data/users.dat
